<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Plus - Seja Bem-vindo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style-login.css">
</head>
<body class="login-body">

    <div class="container d-flex flex-column align-items-center">
        
        <div class="w-100 max-width-900 d-flex justify-content-between align-items-center mb-4 px-3" style="max-width: 900px;">
            <div class="bg-white p-2 rounded-3 shadow-sm">
                <a class="navbar-brand text-primary fw-bold fs-3" href="login.html">Care<span class="text-info">Plus</span></a>
            </div>
            <a href="#" class="text-white text-decoration-none transition-hover">
                <i class="fa-solid fa-right-from-bracket fs-4"></i>
            </a>
        </div>

        <div class="card login-card shadow-lg rounded-4 p-4 p-md-5">
            
            <h1 class="text-center fw-bold mb-5" style="color: #5998C2; letter-spacing: 2px;">SEJA BEM-VINDO!</h1>

            <ul class="nav nav-login justify-content-center mb-5 border-bottom">
                <li class="nav-item">
                    <a class="nav-link active" href="#">Beneficiário</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">RH</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Corretor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Credenciado</a>
                </li>
            </ul>

            <div class="row justify-content-center">
                <div class="col-md-8">
                    
                    <div class="toggle-login-type d-flex mb-4">
                        <button class="btn btn-toggle-active flex-fill py-2 fw-bold">CPF</button>
                        <button class="btn btn-light bg-transparent border-0 flex-fill py-2 fw-bold text-muted">Carteirinha</button>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="small fw-bold mb-1" style="color: #00075F;">CPF</label>
                            <input type="text" class="form-control login-input px-3" placeholder="Informe seu CPF">
                        </div>
                        <div class="mb-1">
                            <label class="small fw-bold mb-1" style="color: #00075F;">Senha</label>
                            <input type="password" class="form-control login-input px-3" placeholder="Informe sua senha">
                        </div>
                        <div class="text-start mb-4">
                            <a href="#" class="small text-decoration-none" style="color: #0079C8;">Esqueceu sua senha?</a>
                        </div>

                        <div class="text-center mb-3">
                            <p class="small text-muted">Se for seu primeiro acesso, <a href="#" class="text-info fw-bold">clique aqui!</a></p>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill btn-enter shadow-sm">ENTRAR</button>
                    </form>

                    <div class="divider d-flex align-items-center my-4">
                        <hr class="flex-grow-1 opacity-25">
                        <span class="mx-3 small text-muted opacity-50">ou</span>
                        <hr class="flex-grow-1 opacity-25">
                    </div>

                    <div class="text-center">
                        <p class="small text-muted">Acesse o site da <span class="fw-bold">Care Plus</span> via <a href="#" class="text-info text-decoration-underline">Single Sign-On</a></p>
                    </div>

                </div>
            </div>
        </div>

        <div class="mt-4 text-white opacity-50 small">
            Care Plus © 2026 - Todos os direitos reservados
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
